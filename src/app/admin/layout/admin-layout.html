<div class="min-h-screen bg-gray-50 lg:flex">
  <!-- Barre supérieure (mobile) -->
  <header class="flex items-center justify-between border-b border-gray-200 bg-secondary px-4 py-3 text-white lg:hidden">
    <a routerLink="/admin" class="flex items-center gap-2 font-heading font-extrabold uppercase tracking-tight">
      <img src="red-dp-logo-32.png" alt="" class="h-7 w-7" />
      Back-office
    </a>
    <button
      type="button"
      class="rounded p-2 hover:bg-white/10"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-nav"
      aria-label="Menu"
      (click)="menuOpen.set(!menuOpen())"
    >
      <i class="pi" [class]="menuOpen() ? 'pi-times' : 'pi-bars'" aria-hidden="true"></i>
    </button>
  </header>

  <!-- Navigation latérale -->
  <aside
    id="admin-nav"
    class="flex-col bg-secondary text-white lg:sticky lg:top-0 lg:flex lg:h-screen lg:w-64 lg:shrink-0"
    [class.hidden]="!menuOpen()"
    [class.flex]="menuOpen()"
  >
    <a routerLink="/admin" class="hidden items-center gap-3 border-b border-white/10 px-6 py-5 lg:flex">
      <img src="red-dp-logo-32.png" alt="" class="h-8 w-8" />
      <span class="leading-tight">
        <span class="block font-heading text-sm font-extrabold uppercase tracking-tight">Debout Patriotes</span>
        <span class="block text-xs text-white/60">Back-office</span>
      </span>
    </a>

    <nav class="flex-1 px-3 py-4" aria-label="Back-office">
      <ul class="flex flex-col gap-1">
        @for (item of nav; track item.url) {
          <li>
            <a
              [routerLink]="item.url"
              routerLinkActive="bg-white/10 text-white"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-white/70 transition-colors hover:bg-white/5 hover:text-white"
            >
              <i class="pi {{ item.icon }}" aria-hidden="true"></i>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="border-t border-white/10 px-3 py-4">
      <a
        href="/"
        target="_blank"
        rel="noopener"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-white/70 hover:bg-white/5 hover:text-white"
      >
        <i class="pi pi-external-link" aria-hidden="true"></i> Voir le site
      </a>
      <button
        type="button"
        class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-white/70 hover:bg-white/5 hover:text-white"
        (click)="logout()"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i> Se déconnecter
      </button>
      @if (user(); as u) {
        <p class="mt-3 truncate px-3 text-xs text-white/50" [title]="u.email">{{ u.displayName }} · {{ u.email }}</p>
      }
    </div>
  </aside>

  <main class="min-w-0 flex-1 px-4 py-6 md:px-8 md:py-10">
    <div class="mx-auto max-w-6xl">
      <router-outlet />
    </div>
  </main>
</div>
