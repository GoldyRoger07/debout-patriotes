<div class="max-w-2xl" [class.mx-auto]="align() === 'center'" [class.text-center]="align() === 'center'">
  @if (eyebrow(); as label) {
    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em]"
       [class]="invert() ? 'text-white/60' : 'text-primary'">{{ label }}</p>
  }

  <h2 class="font-heading text-2xl font-bold leading-tight md:text-4xl"
      [class]="invert() ? 'text-white' : 'text-secondary'">
    {{ heading() }}
  </h2>

  <span class="rule mt-5" [class.mx-auto]="align() === 'center'" [class.bg-white]="invert()"></span>

  @if (lead(); as text) {
    <p class="mt-5 text-base leading-relaxed md:text-lg"
       [class]="invert() ? 'text-white/75' : 'text-foreground-muted'">{{ text }}</p>
  }
</div>
