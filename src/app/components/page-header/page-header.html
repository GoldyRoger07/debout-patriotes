<section class="relative overflow-hidden bg-secondary pt-32 pb-14 md:pt-40 md:pb-20">
  <!-- Trame décorative discrète -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-[0.07]"
       style="background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0); background-size: 28px 28px;"></div>
  <div aria-hidden="true" class="flag-stripe absolute inset-x-0 bottom-0 h-1"></div>

  <my-container>
    <div class="relative max-w-3xl">
      @if (eyebrow(); as label) {
        <p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-white/60">{{ label }}</p>
      }
      <h1 class="font-heading text-3xl font-extrabold leading-tight text-white md:text-5xl">
        {{ title() }}
      </h1>
      @if (lead(); as text) {
        <p class="mt-5 text-lg leading-relaxed text-white/80">{{ text }}</p>
      }
    </div>
  </my-container>
</section>
