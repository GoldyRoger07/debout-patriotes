<a
  [routerLink]="['/candidats', candidate().slug]"
  [attr.tabindex]="decorative() ? -1 : null"
  class="group relative block h-full overflow-hidden rounded-md border border-gray-200 bg-white shadow-card transition-colors duration-200 hover:border-primary/40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
>
  <div class="relative overflow-hidden bg-surface" [style.aspect-ratio]="aspectRatio()">
    <!-- La couverture prime sur la fiche ; le portrait sert de secours. -->
    @if (image(); as visual) {
      <img
        [src]="visual.url | ik: size() : visual.focus"
        [alt]="candidate().name"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      />
    } @else {
      <!-- Visuel neutre en attendant la photo -->
      <div aria-hidden="true" class="flex h-full w-full items-center justify-center bg-gradient-to-b from-gray-100 to-gray-200">
        <i class="pi pi-user text-6xl text-gray-400"></i>
      </div>
    }
    <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-1 bg-primary"></span>
  </div>

  <div class="p-5">
    <h3 class="font-heading text-lg font-bold leading-tight text-secondary transition-colors group-hover:text-primary">
      {{ candidate().name }}
    </h3>
    @if (subtitle(); as line) {
      <p class="mt-1 text-sm text-foreground-muted">{{ line }}</p>
    }
  </div>
</a>
