<section class="flex min-h-[70vh] items-center bg-surface pt-32 pb-20">
  <my-container>
    <div class="mx-auto flex max-w-xl flex-col items-center gap-5 text-center">
      <p class="font-heading text-7xl font-extrabold text-primary/25 md:text-8xl">404</p>

      <h1 class="font-heading text-3xl font-extrabold text-secondary md:text-4xl">
        {{ page().title }}
      </h1>

      <p class="leading-relaxed text-foreground-muted">
        {{ page().lead }}
      </p>

      <div class="mt-2 flex flex-col gap-3 sm:flex-row">
        <a
          [routerLink]="'/' | localize"
          class="rounded-sm bg-primary px-6 py-3 font-bold text-white shadow transition-colors hover:bg-primary-dark"
        >
          {{ page().home }}
        </a>
        <a
          [routerLink]="'/contact' | localize"
          class="rounded-sm border-2 border-primary px-6 py-3 font-bold text-primary transition-colors hover:bg-primary/5"
        >
          {{ page().report }}
        </a>
      </div>
    </div>
  </my-container>
</section>
