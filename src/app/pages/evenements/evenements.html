<my-page-header
  [eyebrow]="page().intro.eyebrow!"
  [title]="page().intro.title"
  [lead]="page().intro.lead"
/>

<section class="py-16 md:py-20">
  <my-container>
    @if (page().items.length) {
      <ul class="flex flex-col gap-5">
        @for (item of page().items; track item.slug) {
          <li class="grid grid-cols-1 gap-6 rounded-md border border-gray-200 bg-white p-6 shadow-card sm:grid-cols-12 md:p-8">
            <div class="flex items-center gap-4 sm:col-span-3 sm:flex-col sm:items-start">
              <span class="inline-flex flex-col items-center rounded-sm bg-primary px-4 py-3 text-white">
                <span class="font-heading text-2xl font-extrabold leading-none">{{ item.date }}</span>
              </span>

              @if (item.time) {
                <span class="text-sm font-semibold text-foreground-muted">{{ item.time }}</span>
              }
            </div>

            <div class="sm:col-span-9">
              <p class="text-xs font-semibold uppercase tracking-wider text-primary">{{ item.kind }}</p>
              <h2 class="mt-1 font-heading text-xl font-bold text-secondary">{{ item.title }}</h2>
              <p class="mt-2 leading-relaxed text-foreground-muted">{{ item.desc }}</p>

              <p class="mt-3 flex items-center gap-2 text-sm text-secondary">
                <i class="pi pi-map-marker text-primary" aria-hidden="true"></i>
                {{ item.place }}, {{ item.city }}
              </p>
            </div>
          </li>
        }
      </ul>
    } @else {
      <my-empty-state [message]="page().empty" icon="pi-calendar" />
    }
  </my-container>
</section>
