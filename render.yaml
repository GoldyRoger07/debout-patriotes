services:
  - type: web
    name: debout-patriotes
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --force
    startCommand: node dist/debout-patriotes/server/server.mjs
    healthCheckPath: /api/ping
    envVars:
      # API Spring jointe par le rendu serveur et par le relais `/api` (voir `.env.example`).
      # Sans elle, le serveur retombe sur `http://localhost:8081` : le rendu serveur ne ramene
      # plus aucune donnee et le relais repond 502.
      - key: API_URL
        value: https://debout-patriotes-api-production.up.railway.app
      - key: NODE_VERSION
        value: v22.22.3
      - key: NODE_ENV
        value: production
      # SSRF protection Angular 21 : hôtes autorisés pour le rendu serveur.
      # Sans ça, Angular retombe en rendu client (CSR) → SEO cassé.
      # hostname uniquement (pas de port/scheme) ; wildcard *.domaine supporté.
      - key: NG_ALLOWED_HOSTS
        value: deboutpatriotes.com,www.deboutpatriotes.com,*.onrender.com
      # Render sert l'app derrière un proxy (x-forwarded-*). Ces en-têtes doivent
      # être approuvés sinon chaque requête proxifiée retombe en CSR.
      - key: NG_TRUST_PROXY_HEADERS
        value: x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-port,x-forwarded-prefix
